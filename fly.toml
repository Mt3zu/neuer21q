app = "neuer21q"
primary_region = "ams"

[build]

[processes]
  app = "php -S 0.0.0.0:8080 -t /app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
